# FORGE CONFIG (DO NOT REMOVE!)
include forge-conf/3456495/before/*;
include forge-conf/3456495/ddaygame.dev/before/*;

server {
    http2 on;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ddaygame.dev;
    server_tokens off;
    root /home/forge/ddaygame.dev/current/public;

    # FORGE SSL (DO NOT REMOVE!)
    ssl_certificate /etc/nginx/ssl/domains/2227589/3892099/server.crt;
    ssl_certificate_key /etc/nginx/ssl/domains/2227589/3892099/server.key;

    # Forge's standard settings from forge-conf/3456495/site.conf, written out here
    # so that "location /" can proxy to the game server instead of serving files.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_dhparam /etc/nginx/dhparams.pem;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    charset utf-8;

    include forge-conf/3456495/server/*;

    # Game server (Node, run as a Forge daemon), including WebSockets.
    location / {
        proxy_pass http://127.0.0.1:3061;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    access_log off;
    error_log  /var/log/nginx/3456495-error.log error;

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

# FORGE CONFIG (DO NOT REMOVE!)
include forge-conf/3456495/after/*;
include forge-conf/3456495/ddaygame.dev/after/*;
